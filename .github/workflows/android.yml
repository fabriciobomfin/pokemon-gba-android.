name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Download offline emulator assets
        run: |
          git clone --depth 1 https://github.com/EmulatorJS/EmulatorJS.git /tmp/emulatorjs
          mkdir -p app/src/main/assets/data
          cp -r /tmp/emulatorjs/data/. app/src/main/assets/data/
          test -f app/src/main/assets/data/loader.js
      - name: Build debug APK
        run: |
          gradle --version
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-gba-offline-debug-apk
          path: app/build/outputs/apk/debug/*.apk
