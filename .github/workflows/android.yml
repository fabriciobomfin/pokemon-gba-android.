name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Download offline emulator assets
        run: |
          git clone --depth 1 https://github.com/EmulatorJS/EmulatorJS.git /tmp/emulatorjs
          mkdir -p app/src/main/assets/data
          cp -r /tmp/emulatorjs/data/. app/src/main/assets/data/
          test -f app/src/main/assets/data/loader.js
      - name: Bundle offline GBA runtime
        run: |
          DATA=app/src/main/assets/data
          mkdir -p "$DATA/cores"
          curl --fail --location --retry 3 https://cdn.emulatorjs.org/stable/data/emulator.min.js -o "$DATA/emulator.min.js"
          curl --fail --location --retry 3 https://cdn.emulatorjs.org/stable/data/emulator.min.css -o "$DATA/emulator.min.css"
          curl --fail --location --retry 3 https://cdn.emulatorjs.org/stable/data/cores/mgba-wasm.data -o "$DATA/cores/mgba-wasm.data"
          test -s "$DATA/emulator.min.js"
          test -s "$DATA/emulator.min.css"
          test -s "$DATA/cores/mgba-wasm.data"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-gba-offline-debug-apk
          path: app/build/outputs/apk/debug/*.apk
