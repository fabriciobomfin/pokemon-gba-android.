<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' blob: 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' blob: data:; worker-src 'self' blob:; img-src 'self' blob: data:; media-src 'self' blob: data:"><title>GBA Offline</title><style>
html,body{margin:0;background:#070c16;color:#e6efff;height:100%;overflow:hidden;font:14px system-ui}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#111d30;flex:none}button{border:0;border-radius:9px;background:#263952;color:#e6efff;padding:10px;font:600 13px system-ui}#status{flex:1;font-size:12px;color:#a9bbd2}#game{flex:1;min-height:0;width:100%;touch-action:none}.ejs_parent{background:#070c16!important}#error{display:none;position:fixed;inset:80px 20px auto;background:#20314b;padding:20px;border-radius:15px;z-index:99999}a{color:#75edb7}
</style></head><body><header><button onclick="leaveGame()">‹ Início</button><span id="status">Preparando emulador…</span><button onclick="saveGame(true)">Gravar</button></header><div id="game"></div><div id="error">O emulador não iniciou. <a href="index.html">Voltar e importar a ROM novamente</a>.<p id="errorText"></p></div><script>
const rom=JSON.parse(Android.info());
if(!rom.available) Android.home();
window.EJS_player='#game';
window.EJS_core='mgba';
window.EJS_gameUrl='/roms/'+rom.id+'.gba';
window.EJS_gameName='gba-'+rom.id;
window.EJS_pathtodata='/assets/data/';
window.EJS_language='pt-BR';
window.EJS_disableAutoLang=false;
window.EJS_startOnLoaded=false;
window.EJS_startButtonName='Jogar offline';
window.EJS_threads=false;
window.EJS_color='#68e3ae';
window.EJS_controlScheme='gba';
window.EJS_Buttons={netplay:false,volume:true,saveState:false,loadState:false,saveSavFiles:false,loadSavFiles:false,screenRecord:false};
window.EJS_defaultOptions={'save-save-interval':5,'virtual-gamepad':'enabled'};
let wasRunning=false;
function toBase64(bytes){let value='';for(let offset=0;offset<bytes.length;offset+=8192)value+=String.fromCharCode.apply(null,bytes.subarray(offset,offset+8192));return btoa(value);}
function saveGame(notify){const e=window.EJS_emulator;if(!e||!e.started||!e.gameManager)return false;const g=e.gameManager;g.saveSaveFiles();let files={};for(const name of g.FS.readdir('/data/saves')){if(name==='.'||name==='..')continue;const path='/data/saves/'+name;if(g.FS.isFile(g.FS.stat(path).mode))files[name]=toBase64(g.FS.readFile(path));}const ok=Android.saveFiles(JSON.stringify(files));g.FS.syncfs(false,()=>{});if(notify)document.getElementById('status').textContent=ok?'Progresso gravado no celular':'Erro ao gravar progresso';return ok;}
window.flushAndPause=()=>{const e=window.EJS_emulator;wasRunning=!!(e&&e.started&&!e.paused);saveGame(false);if(wasRunning)e.pause();};
window.resumeGame=()=>{const e=window.EJS_emulator;if(wasRunning&&e&&e.started)e.play();wasRunning=false;};
window.leaveGame=()=>{saveGame(false);Android.home();};
window.EJS_ready=()=>{document.getElementById('status').textContent='Toque em Jogar offline';EJS_emulator.on('saveDatabaseLoaded',fs=>{const files=JSON.parse(Android.loadFiles());for(const name of Object.keys(files)){const value=atob(files[name]);const bytes=new Uint8Array(value.length);for(let i=0;i<value.length;i++)bytes[i]=value.charCodeAt(i);fs.writeFile('/data/saves/'+name,bytes);}});};
window.EJS_onGameStart=()=>{document.getElementById('status').textContent='Offline · salve pelo menu do jogo';setInterval(()=>saveGame(false),5000);};
window.runtimeErrors=[];
window.addEventListener('error',event=>{window.runtimeErrors.push(event.message);if(window.webviewUnsupported)return;document.getElementById('error').style.display='block';document.getElementById('errorText').textContent=event.message||'Falha ao carregar um componente local.';});
try{new Function('let a={}; a.x ??= 1; return a?.x;')();}catch(error){window.webviewUnsupported=true;document.getElementById('error').style.display='block';document.getElementById('errorText').textContent='Atualize o Android System WebView pela Play Store e reabra o aplicativo. O componente instalado no celular é antigo demais para este emulador.';}
</script><script src="/assets/data/loader.js"></script></body></html>
