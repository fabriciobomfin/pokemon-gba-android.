const rom=JSON.parse(Android.info());if(!rom.available)Android.home();document.getElementById('game-name').textContent=rom.name||'Jogo de Game Boy Advance';
const isDS=rom.system==='nds';document.body.dataset.system=isDS?'nds':'gba';
window.EJS_player='#game';window.EJS_core=isDS?'desmume2015':'mgba';window.EJS_gameUrl='/roms/'+rom.id+'.'+(isDS?'nds':'gba');window.EJS_gameName=(isDS?'nds-':'gba-')+rom.id;window.EJS_pathtodata='/assets/data/';window.EJS_language='pt-BR';window.EJS_disableAutoLang=false;window.EJS_startOnLoaded=false;window.EJS_startButtonName='Jogar';window.EJS_threads=false;window.EJS_color='#69e3b4';window.EJS_controlScheme=isDS?'nds':'gba';window.EJS_Buttons={screenshot:false,contextMenu:false,netplay:false,volume:true,saveState:false,loadState:false,saveSavFiles:false,loadSavFiles:false,screenRecord:false};window.EJS_defaultOptions={'save-save-interval':1,'virtual-gamepad':'enabled',...(isDS?{'desmume_pointer_type':'touch','desmume_pointer_mouse':'enabled','desmume_screens_layout':'left/right','desmume_screens_gap':'0'}:{})};
let wasRunning=false;
function toBase64(bytes){let value='';for(let offset=0;offset<bytes.length;offset+=8192)value+=String.fromCharCode.apply(null,bytes.subarray(offset,offset+8192));return btoa(value);}
let lastNativeSave='';
function validSavePath(name){
 return name.length<=320 && name.split('/').length<=4 &&
  name.split('/').every(part=>/^[a-zA-Z0-9._ -]{1,160}$/.test(part)&&part!=='.'&&part!=='..');
}
function collectSaveFiles(fs,directory='/data/saves',prefix='',files={}){
 for(const name of fs.readdir(directory)){
  if(name==='.'||name==='..'||name.endsWith('.bak')||name.endsWith('.new'))continue;
  if(/^[a-f0-9]{64}\.(srm|dsv|sav|rtc)$/.test(name)&&!name.startsWith(rom.id+'.'))continue;
  const relative=prefix+name,path=directory+'/'+name;
  if(!validSavePath(relative))continue;
  const stat=fs.stat(path);
  if(fs.isDir(stat.mode))collectSaveFiles(fs,path,relative+'/',files);
  else if(fs.isFile(stat.mode))files[relative]=toBase64(fs.readFile(path));
 }
 return files;
}
function persistCartridgeFiles(){
 const g=window.EJS_emulator?.gameManager;if(!g)return false;
 const json=JSON.stringify(collectSaveFiles(g.FS));
 if(json===lastNativeSave)return true;
 if(!Android.saveFiles(json))return false;
 lastNativeSave=json;
 return true;
}
function saveGame(notify){
 const e=window.EJS_emulator;if(!e?.started||!e.gameManager)return false;
 try{
  e.gameManager.saveSaveFiles();
  const ok=persistCartridgeFiles();
  if(notify||!ok)document.getElementById('status').textContent=ok?'Progresso do cartucho gravado':'Falha ao gravar o progresso. Tente novamente.';
  return ok;
 }catch(error){
  console.error('Falha ao gravar o cartucho',error);
  document.getElementById('status').textContent='Falha ao gravar o progresso. Tente novamente.';
  return false;
 }
}
window.flushAndPause=()=>{const e=window.EJS_emulator;wasRunning=!!(e&&e.started&&!e.paused);saveGame(false);if(wasRunning)e.pause();};window.resumeGame=()=>{const e=window.EJS_emulator;if(wasRunning&&e&&e.started)e.play();wasRunning=false;};window.leaveGame=()=>{if(!window.EJS_emulator?.started||saveGame(false))Android.home();else alert('Não foi possível gravar o progresso. Tente novamente antes de sair.');};
function toggleSettings(force){const panel=document.getElementById('settings-panel');const open=typeof force==='boolean'?force:panel.hidden;panel.hidden=!open;if(open){for(const group of panel.querySelectorAll('details'))group.open=false;panel.scrollTop=0;}for(const id of ['settings-toggle','reopen'])document.getElementById(id).setAttribute('aria-expanded',String(open));}
function applyPreferences(){let prefs={};try{prefs=JSON.parse(localStorage.getItem('gba-visual-settings:'+rom.id)||'{}')}catch(_){}const size=document.getElementById('control-size'),opacity=document.getElementById('control-opacity'),show=document.getElementById('show-controls'),sharp=document.getElementById('sharp-image');size.value=prefs.size||100;opacity.value=prefs.opacity||70;show.checked=prefs.show!==false;sharp.checked=prefs.sharp!==false;const apply=()=>{document.documentElement.style.setProperty('--control-scale',Number(size.value)/100);document.documentElement.style.setProperty('--control-opacity',Number(opacity.value)/100);document.body.classList.toggle('controls-hidden',!show.checked);document.querySelectorAll('.ejs_canvas').forEach(canvas=>canvas.style.imageRendering=sharp.checked?'pixelated':'auto');document.getElementById('size-value').textContent=size.value+'%';document.getElementById('opacity-value').textContent=opacity.value+'%';try{localStorage.setItem('gba-visual-settings:'+rom.id,JSON.stringify({size:Number(size.value),opacity:Number(opacity.value),show:show.checked,sharp:sharp.checked}));}catch(_){} };for(const control of [size,opacity,show,sharp])control.addEventListener('input',apply);for(const control of [show,sharp])control.addEventListener('change',apply);apply();}
applyPreferences();document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!document.getElementById('settings-panel').hidden)toggleSettings(false);});
function restoreNativeSaves(fs){
 const files=JSON.parse(Android.loadFiles()||'{}');
 for(const [name,encoded] of Object.entries(files)){
  if(!validSavePath(name))continue;
  const value=atob(encoded),bytes=Uint8Array.from(value,c=>c.charCodeAt(0));
  const parts=name.split('/');parts.pop();
  let directory='/data/saves';
  for(const part of parts){directory+='/'+part;if(!fs.analyzePath(directory).exists)fs.mkdir(directory);}
  fs.writeFile('/data/saves/'+name,bytes);

}
window.EJS_ready=()=>{
 const emulator=window.EJS_emulator;
 emulator.on('saveDatabaseLoaded',restoreNativeSaves);
 emulator.on('saveSaveFiles',()=>{try{persistCartridgeFiles();}catch(error){console.error('Falha na cópia do cartucho',error);}});
 // Install restoration before loading the core, including a warm cached launch.
 document.querySelector('.ejs_start_button').click();
};

try{new Function('let a={}; a.x ??= 1; return a?.x;')();}catch(error){window.webviewUnsupported=true;document.getElementById('error').style.display='block';document.getElementById('errorText').textContent='Atualize o Android System WebView e reabra o aplicativo.';}
