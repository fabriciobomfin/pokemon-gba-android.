plugins { id 'com.android.application' }
android {
    namespace 'com.fabricio.gbaoffline'
    compileSdk 35
    defaultConfig {
        applicationId 'com.fabricio.firegame'
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName '2.4'
        testInstrumentationRunner 'com.fabricio.gbaoffline.OfflineSmokeRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress 'data', 'wasm' }
}

