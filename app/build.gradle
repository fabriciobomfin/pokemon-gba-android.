plugins { id 'com.android.application' }
android {
    namespace 'com.fabricio.gbaoffline'
    compileSdk 35
    defaultConfig {
        applicationId 'com.fabricio.firegame.stable'
        minSdk 24
        targetSdk 35
        versionCode = (project.findProperty('fireVersionCode') ?: '15').toInteger()
        versionName '3.2'
        testInstrumentationRunner 'com.fabricio.gbaoffline.OfflineSmokeRunner'
    }
    buildTypes {
        debug { applicationIdSuffix '.testbuild' }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress 'data', 'wasm' }
}

